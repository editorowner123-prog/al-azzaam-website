<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — PPTQ Al Azzaam</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --maroon-950:#2b0810; --maroon-900:#3d0c14; --maroon-800:#5c1120; --maroon-700:#7a0f1f;
  --maroon-600:#9b1c2e; --maroon-500:#c22638;
  --gold-300:#f7e7ab; --gold-400:#e8c766; --gold-500:#d4af37; --gold-600:#b8892b;
  --gold-shine:linear-gradient(120deg, var(--gold-300) 0%, var(--gold-500) 35%, var(--gold-600) 60%, var(--gold-400) 100%);
  --cream-50:#fff8f3; --cream-100:#fdf1e8; --ink-900:#241012; --ink-600:#6b4750;
  --line:#f0d9c9; --surface:#fff; --shadow:0 10px 28px -12px rgba(61,12,20,.18); --radius:16px;
  --ok:#2f9e44; --bad:#d1364a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream-50);color:var(--ink-900);min-height:100vh;}
h1,h2,h3{font-family:'Outfit',sans-serif;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff;color:var(--ink-900);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-500);}
label{font-size:12px;font-weight:700;color:var(--ink-600);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}
.btn{border:none;font-weight:800;font-size:13px;padding:10px 18px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
.btn-gold{background:var(--gold-shine);color:var(--maroon-950);}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink-900);}
.btn-danger{background:#fdecec;color:var(--bad);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 500px at 20% -10%, rgba(212,175,55,.15), transparent 60%), var(--maroon-950);padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:36px 30px;max-width:360px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);text-align:center;}
.login-ring{width:60px;height:60px;border-radius:50%;background:var(--maroon-950);margin:0 auto 16px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold-500);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
.login-card h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--maroon-900);margin-bottom:4px;}
.login-card p{font-size:12.5px;color:var(--ink-600);margin-bottom:22px;}
#loginError{color:var(--bad);font-size:12px;margin-top:10px;display:none;}

/* ---------- APP SHELL ---------- */
#app{display:none;}
.topbar{background:var(--maroon-950);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-brand{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;}
.topbar-brand .ring{width:30px;height:30px;border-radius:50%;background:var(--maroon-900);box-shadow:0 0 0 2px var(--gold-500);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-size:12px;}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;}
.tab-btn{background:none;border:none;padding:14px 16px;font-weight:700;font-size:13px;color:var(--ink-600);border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--maroon-700);border-color:var(--gold-500);}
.content{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
.content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.content-head h2{font-size:18px;color:var(--maroon-900);}

/* ---------- LIST ---------- */
.item-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.item-main{flex:1;min-width:180px;}
.item-title{font-weight:700;font-size:14px;color:var(--ink-900);}
.item-meta{font-size:11.5px;color:var(--ink-600);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--cream-100);color:var(--gold-600);text-transform:uppercase;}
.pill.published{background:#e6f6ea;color:var(--ok);}
.pill.draft{background:#fdf1e8;color:var(--ink-600);}
.item-actions{display:flex;gap:6px;flex:none;}
.empty{text-align:center;padding:40px 20px;color:var(--ink-600);font-size:13px;border:1.5px dashed var(--line);border-radius:var(--radius);}

/* ---------- MODAL FORM ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(43,8,16,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:26px 24px;margin-top:20px;}
.modal h3{font-size:16px;color:var(--maroon-900);margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--cream-100);}
.upload-status{font-size:11.5px;color:var(--ink-600);margin-top:4px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--maroon-950);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;display:none;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-ring">A</div>
    <h1>Panel Admin</h1>
    <p>PPTQ Al Azzaam — Website Informasi</p>
    <div class="field" style="text-align:left"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@email.com"></div>
    <div class="field" style="text-align:left"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
    <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doLogin()">Masuk</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand"><span class="ring">A</span> Panel Admin</div>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">Keluar</button>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div class="content">
    <div class="content-head">
      <h2 id="contentTitle">—</h2>
      <button class="btn btn-gold btn-sm" id="addBtn" onclick="openForm()">+ Tambah</button>
    </div>
    <div id="listArea"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Tambah Data</h3>
    <div id="formArea"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeForm()">Batal</button>
      <button class="btn btn-gold" onclick="saveRecord()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://ttpkztaxfpjhkwtnbpec.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cGt6dGF4ZnBqaGt3dG5icGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDExOTUsImV4cCI6MjEwMjk3NzE5NX0.yfeSSewI_CDw64WxYU4qUVeEbVLsHXVqpDpeCGDT5PI";
const sb = supabase.createClient(SB_URL, SB_ANON);

// ---------- Konfigurasi tabel (generik, biar 1 mesin CRUD dipakai semua) ----------
const TABLES = {
  berita: {
    label: 'Berita', pk: 'id', orderBy: 'created_at', ascending: false,
    titleField: 'judul',
    meta: r => [r.kategori, `<span class="pill ${r.status}">${r.status}</span>`, r.tanggal_publish ? new Date(r.tanggal_publish).toLocaleDateString('id-ID') : ''],
    fields: [
      {key:'judul', label:'Judul', type:'text', required:true},
      {key:'slug', label:'Slug (URL, huruf kecil tanpa spasi)', type:'text', required:true},
      {key:'ringkasan', label:'Ringkasan Singkat', type:'textarea'},
      {key:'isi', label:'Isi Berita', type:'textarea-lg', required:true},
      {key:'foto_url', label:'Foto', type:'image', folder:'berita'},
      {key:'kategori', label:'Kategori', type:'select', options:['Prestasi','Kegiatan','Pengumuman']},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
      {key:'tanggal_publish', label:'Tanggal Publish', type:'date'},
    ]
  },
  program: {
    label: 'Program', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'nama',
    meta: r => [r.jenjang, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'nama', label:'Nama Program', type:'text', required:true},
      {key:'jenjang', label:'Jenjang', type:'select', options:['Tahfidz','Diniyah','SMP','MA']},
      {key:'deskripsi', label:'Deskripsi', type:'textarea'},
      {key:'icon', label:'Ikon (emoji, misal 📿)', type:'text'},
      {key:'urutan', label:'Urutan Tampil (angka, kecil = di depan)', type:'number'},
    ]
  },
  galeri: {
    label: 'Galeri', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'judul',
    meta: r => [r.tipe, r.kategori, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'judul', label:'Judul', type:'text'},
      {key:'media_url', label:'Foto / Thumbnail', type:'image', folder:'galeri'},
      {key:'tipe', label:'Tipe', type:'select', options:['foto','video']},
      {key:'kategori', label:'Kategori (misal: Fasilitas, Wisuda)', type:'text'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
    ]
  },
  info_ppdb: {
    label: 'Info PPDB', pk: 'id', orderBy: 'updated_at', ascending: false,
    titleField: 'tahun_ajaran',
    meta: r => [`<span class="pill ${r.status}">${r.status}</span>`],
    fields: [
      {key:'tahun_ajaran', label:'Tahun Ajaran (misal 2027/2028)', type:'text', required:true},
      {key:'syarat', label:'Syarat Pendaftaran', type:'textarea'},
      {key:'jadwal', label:'Jadwal Pendaftaran', type:'textarea'},
      {key:'biaya', label:'Rincian Biaya', type:'textarea'},
      {key:'kontak_wa', label:'Nomor WA Panitia', type:'text'},
      {key:'formulir_url', label:'Link Formulir (Google Form / PDF)', type:'text'},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
    ]
  },
  struktur_pengurus: {
    label: 'Struktur Pengurus', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'nama',
    meta: r => [r.jabatan, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'nama', label:'Nama', type:'text', required:true},
      {key:'jabatan', label:'Jabatan', type:'text'},
      {key:'foto_url', label:'Foto', type:'image', folder:'pengurus'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
    ]
  },
  running_text: {
    label: 'Running Text', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'teks',
    meta: r => [`<span class="pill ${r.status}">${r.status}</span>`, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'teks', label:'Isi Teks Berjalan', type:'textarea'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
    ]
  },
  pengaturan_situs: {
    label: 'Pengaturan Situs', pk: 'key', orderBy: 'key', ascending: true,
    titleField: 'key', keyIsFixed: true,
    meta: r => [r.value ? r.value.slice(0,60) : ''],
    fields: [
      {key:'key', label:'Key (misal: alamat, no_wa, email, jumlah_santri)', type:'text', required:true},
      {key:'value', label:'Value', type:'textarea'},
    ]
  }
};

let currentTab = 'berita';
let currentRecord = null; // null = tambah baru, object = sedang edit

// ---------- AUTH ----------
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){
    errBox.textContent = 'Login gagal: ' + error.message;
    errBox.style.display = 'block';
    return;
  }
  showApp();
}
async function doLogout(){
  await sb.auth.signOut();
  location.reload();
}
async function checkSession(){
  const {data} = await sb.auth.getSession();
  if(data.session) showApp();
}
function showApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTabs();
  switchTab('berita');
}

// ---------- TABS ----------
function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = Object.keys(TABLES).map(k =>
    `<button class="tab-btn" id="tab-${k}" onclick="switchTab('${k}')">${TABLES[k].label}</button>`
  ).join('');
}
function switchTab(key){
  currentTab = key;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  document.getElementById('contentTitle').textContent = TABLES[key].label;
  loadList();
}

// ---------- LIST ----------
async function loadList(){
  const cfg = TABLES[currentTab];
  const area = document.getElementById('listArea');
  area.innerHTML = '<div class="empty">Memuat data…</div>';

  let logoHtml = '';
  if(currentTab === 'pengaturan_situs'){
    const profilHtml = await renderProfilCard();
    const kontakHtml = await renderKontakSosmedCard();
    const heroPhotoHtml = await renderHeroPhotoCard();
    const tickerStyleHtml = await renderTickerStyleCard();
    const flyerHtml = await renderFlyerCard();
    logoHtml = profilHtml + kontakHtml + heroPhotoHtml + tickerStyleHtml + flyerHtml + await renderLogoCard();
  }

  const {data, error} = await sb.from(currentTab).select('*').order(cfg.orderBy, {ascending: cfg.ascending});
  if(error){
    area.innerHTML = logoHtml + `<div class="empty">Gagal memuat: ${error.message}</div>`;
    if(currentTab === 'pengaturan_situs'){ updateLogoPreview(); updateTickerPreview(); updateFlyerPreview(); }
    return;
  }
  if(!data || data.length===0){
    area.innerHTML = logoHtml + `<div class="empty">Belum ada data ${cfg.label.toLowerCase()}. Klik "+ Tambah" untuk mulai.</div>`;
    if(currentTab === 'pengaturan_situs'){ updateLogoPreview(); updateTickerPreview(); updateFlyerPreview(); }
    return;
  }
  area.innerHTML = logoHtml + data.map(r => `
    <div class="item-card">
      <div class="item-main">
        <div class="item-title">${r[cfg.titleField] || '(tanpa judul)'}</div>
        <div class="item-meta">${cfg.meta(r).filter(Boolean).join(' &bull; ')}</div>
      </div>
      <div class="item-actions">
        <button class="btn btn-outline btn-sm" onclick='openForm(${JSON.stringify(r).replace(/'/g,"&apos;")})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteRecord('${r[cfg.pk]}')">Hapus</button>
      </div>
    </div>
  `).join('');
  if(currentTab === 'pengaturan_situs'){ updateLogoPreview(); updateTickerPreview(); updateFlyerPreview(); }
}

// ---------- FORM ----------
function openForm(record){
  currentRecord = record || null;
  const cfg = TABLES[currentTab];
  document.getElementById('modalTitle').textContent = record ? `Edit ${cfg.label}` : `Tambah ${cfg.label}`;
  const area = document.getElementById('formArea');
  area.innerHTML = cfg.fields.map(f => renderField(f, record ? record[f.key] : '')).join('');
  document.getElementById('modalOverlay').classList.add('open');

  // auto-generate slug dari judul untuk berita baru
  const judulInput = document.getElementById('f_judul');
  const slugInput = document.getElementById('f_slug');
  if(judulInput && slugInput && !record){
    judulInput.addEventListener('blur', ()=>{
      if(!slugInput.value){
        slugInput.value = judulInput.value.toLowerCase().trim()
          .replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-');
      }
    });
  }
}
function closeForm(){
  document.getElementById('modalOverlay').classList.remove('open');
  currentRecord = null;
}
function renderField(f, value){
  value = value ?? '';
  const id = 'f_' + f.key;
  if(f.type==='textarea' || f.type==='textarea-lg'){
    const rows = f.type==='textarea-lg' ? 7 : 3;
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" rows="${rows}">${value}</textarea></div>`;
  }
  if(f.type==='select'){
    return `<div class="field"><label>${f.label}</label><select id="${id}">
      ${f.options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  if(f.type==='number'){
    return `<div class="field"><label>${f.label}</label><input type="number" id="${id}" value="${value}"></div>`;
  }
  if(f.type==='date'){
    const d = value ? new Date(value).toISOString().slice(0,10) : '';
    return `<div class="field"><label>${f.label}</label><input type="date" id="${id}" value="${d}"></div>`;
  }
  if(f.type==='image'){
    return `<div class="field"><label>${f.label}</label>
      ${value ? `<img src="${value}" class="img-preview">` : ''}
      <input type="hidden" id="${id}" value="${value}">
      <input type="file" accept="image/*" onchange="uploadImage(this,'${id}','${f.folder}')">
      <div class="upload-status" id="${id}_status"></div>
    </div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" id="${id}" value="${value}"></div>`;
}

async function uploadImage(input, targetId, folder){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById(targetId+'_status');
  statusEl.textContent = 'Mengunggah…';
  const path = `${folder}/${Date.now()}-${file.name.replace(/\s+/g,'-')}`;
  const {error} = await sb.storage.from('media-website').upload(path, file);
  if(error){
    statusEl.textContent = 'Gagal unggah: ' + error.message;
    return;
  }
  const {data} = sb.storage.from('media-website').getPublicUrl(path);
  document.getElementById(targetId).value = data.publicUrl;
  statusEl.textContent = 'Berhasil diunggah ✓';
}

// ---------- KONTEN PROFIL (Sejarah/Visi/Misi, perlakuan khusus) ----------
async function renderProfilCard(){
  const {data} = await sb.from('pengaturan_situs').select('key,value').in('key',['profil_sejarah','profil_visi','profil_misi','ringkasan_tentang']);
  const map = {}; (data||[]).forEach(r=>map[r.key]=r.value);
  return `
    <div class="item-card" style="flex-direction:column;align-items:stretch;">
      <div class="item-title" style="margin-bottom:10px;">📖 Konten Profil (Sejarah, Visi, Misi)</div>
      <div class="field"><label>Ringkasan Singkat (tampil di card "Tentang Pondok" Beranda, 2-3 kalimat)</label><textarea id="ringkasanTentang" rows="3">${map.ringkasan_tentang||''}</textarea></div>
      <div class="field"><label>Sejarah (halaman Profil lengkap)</label><textarea id="profilSejarah" rows="4">${map.profil_sejarah||''}</textarea></div>
      <div class="field"><label>Visi (1 poin per baris, akan otomatis diberi nomor)</label><textarea id="profilVisi" rows="2">${map.profil_visi||''}</textarea></div>
      <div class="field" style="margin-bottom:10px;"><label>Misi (1 poin per baris, akan otomatis diberi nomor)</label><textarea id="profilMisi" rows="4">${map.profil_misi||''}</textarea></div>
      <button class="btn btn-gold btn-sm" style="align-self:flex-start" onclick="saveProfilKonten()">Simpan Konten Profil</button>
      <div class="upload-status" id="profilStatus"></div>
    </div>
  `;
}
async function saveProfilKonten(){
  const rows = [
    {key:'ringkasan_tentang', value: document.getElementById('ringkasanTentang').value},
    {key:'profil_sejarah', value: document.getElementById('profilSejarah').value},
    {key:'profil_visi', value: document.getElementById('profilVisi').value},
    {key:'profil_misi', value: document.getElementById('profilMisi').value},
  ];
  const statusEl = document.getElementById('profilStatus');
  statusEl.textContent = 'Menyimpan…';
  const {error} = await sb.from('pengaturan_situs').upsert(rows);
  if(error){ statusEl.textContent = 'Gagal simpan: ' + error.message; return; }
  statusEl.textContent = 'Tersimpan ✓';
  showToast('Konten Profil tersimpan ✓');
}



// ---------- FLYER POP-UP AWAL (perlakuan khusus) ----------
let pendingFlyerFile = null;
let pendingFlyerObjectUrl = null;

async function renderFlyerCard(){
  const {data} = await sb.from('pengaturan_situs').select('key,value').in('key',['flyer_image_url','flyer_link_url','flyer_active']);
  const map = {}; (data||[]).forEach(r=>map[r.key]=r.value);
  pendingFlyerFile = null;
  pendingFlyerObjectUrl = null;

  return `
    <div class="item-card" style="flex-direction:column;align-items:stretch;">
      <div class="item-title" style="margin-bottom:10px;">🎈 Flyer Pop-up Awal</div>
      <p style="font-size:11.5px;color:var(--ink-600);margin:0 0 10px;">Muncul otomatis sekali saat pengunjung pertama kali buka website. Bisa ditutup (✕) atau diklik untuk menuju link.</p>

      <div class="field">
        <label>Aktifkan Pop-up?</label>
        <select id="flyerActive" onchange="updateFlyerPreview()">

function renderFlyerPreviewImg(url){

async function updateFlyerPreview(){
  if(pendingFlyerObjectUrl){
    renderFlyerPreviewImg(pendingFlyerObjectUrl);
  } else {
    const {data} = await sb.from('pengaturan_situs').select('value').eq('key','flyer_image_url').maybeSingle();
    renderFlyerPreviewImg(data ? data.value : '');
  }
}

function onFlyerFileChosen(input){
  const file = input.files[0];
  if(!file) return;
  pendingFlyerFile = file;

  pendingFlyerObjectUrl = URL.createObjectURL(file);

async function applyFlyerFinal(){
  const statusEl = document.getElementById('flyerStatus');
  const active = document.getElementById('flyerActive').value;
  const link = document.getElementById('flyerLink').value;
  let finalUrl = null;

  if(pendingFlyerFile){
    statusEl.textContent = 'Mengunggah…';
    const path = `flyer/${Date.now()}-${pendingFlyerFile.name.replace(/\s+/g,'-')}`;
    const {error} = await sb.storage.from('media-website').upload(path, pendingFlyerFile);
    if(error){ statusEl.textContent = 'Gagal unggah: ' + error.message; return; }
    finalUrl = sb.storage.from('media-website').getPublicUrl(path).data.publicUrl;
  } else {
    const {data} = await sb.from('pengaturan_situs').select('value').eq('key','flyer_image_url').maybeSingle();
    finalUrl = data ? data.value : null;
  }

  if(active === 'ya' && !finalUrl){
    statusEl.textContent = 'Upload gambar dulu sebelum mengaktifkan pop-up.';
    return;
  }

  statusEl.textContent = 'Menyimpan…';
  const rows = [
    {key:'flyer_active', value: active},
    {key:'flyer_link_url', value: link},
  ];
  if(finalUrl) rows.push({key:'flyer_image_url', value: finalUrl});
  const {error: upsertErr} = await sb.from('pengaturan_situs').upsert(rows);
  if(upsertErr){ statusEl.textContent = 'Gagal simpan: ' + upsertErr.message; return; }

  statusEl.textContent = 'Flyer diterapkan ✓';
  showToast('Flyer pop-up diterapkan ✓');
  loadList();
}

async function saveRecord(){
  const cfg = TABLES[currentTab];
  const payload = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('f_'+f.key);
    let v = el.value;
    if(f.type==='number') v = v === '' ? null : Number(v);
    payload[f.key] = v === '' ? null : v;
  });

  let error;
  if(currentRecord){
    // update berdasarkan primary key
    const pkVal = currentRecord[cfg.pk];
    ({error} = await sb.from(currentTab).update(payload).eq(cfg.pk, pkVal));
  } else {
    ({error} = await sb.from(currentTab).insert(payload));
  }
  if(error){
    showToast('Gagal menyimpan: ' + error.message);
    return;
  }
  closeForm();
  showToast('Tersimpan ✓');
  loadList();
}

async function deleteRecord(pkVal){
  if(!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.')) return;
  const cfg = TABLES[currentTab];
  const {error} = await sb.from(currentTab).delete().eq(cfg.pk, pkVal);
  if(error){
    showToast('Gagal menghapus: ' + error.message);
    return;
  }
  showToast('Data dihapus');
  loadList();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2500);
}
