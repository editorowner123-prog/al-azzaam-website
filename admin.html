<!DOCTYPE html>
<html lang="id" data-no-tema>
<head>
<meta charset="UTF-8">
<link id="faviconLink" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2730%27 fill=%27%232b0810%27/%3E%3Ctext x=%2732%27 y=%2743%27 font-family=%27Georgia,serif%27 font-size=%2732%27 font-weight=%27700%27 fill=%27%23d4af37%27 text-anchor=%27middle%27%3EA%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin — PPTQ Al Azzaam</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --maroon-950:#2b0810; --maroon-900:#3d0c14; --maroon-800:#5c1120; --maroon-700:#7a0f1f;
  --maroon-600:#9b1c2e; --maroon-500:#c22638;
  --gold-300:#f7e7ab; --gold-400:#e8c766; --gold-500:#d4af37; --gold-600:#b8892b;
  --gold-shine:linear-gradient(120deg, var(--gold-300) 0%, var(--gold-500) 35%, var(--gold-600) 60%, var(--gold-400) 100%);
  --cream-50:#fff8f3; --cream-100:#fdf1e8; --ink-900:#241012; --ink-600:#6b4750;
  --line:#f0d9c9; --surface:#fff; --shadow:0 10px 28px -12px rgba(61,12,20,.18); --radius:16px;
  --ok:#2f9e44; --bad:#d1364a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--cream-50);color:var(--ink-900);min-height:100vh;}
h1,h2,h3{font-family:'Outfit',sans-serif;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;background:#fff;color:var(--ink-900);}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-500);}
label{font-size:12px;font-weight:700;color:var(--ink-600);display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}
.btn{border:none;font-weight:800;font-size:13px;padding:10px 18px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;}
.btn-gold{background:var(--gold-shine);color:var(--maroon-950);}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink-900);}
.btn-danger{background:#fdecec;color:var(--bad);}
.btn-sm{padding:6px 12px;font-size:11.5px;}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 500px at 20% -10%, rgba(212,175,55,.15), transparent 60%), var(--maroon-950);padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:36px 30px;max-width:360px;width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);text-align:center;}
.login-ring{width:60px;height:60px;border-radius:50%;background:var(--maroon-950);margin:0 auto 16px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--gold-500);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-family:'Playfair Display',serif;font-size:24px;font-weight:700;}
.login-card h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--maroon-900);margin-bottom:4px;}
.login-card p{font-size:12.5px;color:var(--ink-600);margin-bottom:22px;}
#loginError{color:var(--bad);font-size:12px;margin-top:10px;display:none;}

/* ---------- APP SHELL ---------- */
#app{display:none;}
.topbar{background:var(--maroon-950);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-brand{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;}
.topbar-brand .ring{width:30px;height:30px;border-radius:50%;background:var(--maroon-900);box-shadow:0 0 0 2px var(--gold-500);display:flex;align-items:center;justify-content:center;color:var(--gold-400);font-size:12px;}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;}
.tab-btn{background:none;border:none;padding:14px 16px;font-weight:700;font-size:13px;color:var(--ink-600);border-bottom:3px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--maroon-700);border-color:var(--gold-500);}
.content{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
.content-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.content-head h2{font-size:18px;color:var(--maroon-900);}

/* ---------- LIST ---------- */
.item-card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.item-main{flex:1;min-width:180px;}
.item-title{font-weight:700;font-size:14px;color:var(--ink-900);}
.item-meta{font-size:11.5px;color:var(--ink-600);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:10px;background:var(--cream-100);color:var(--gold-600);text-transform:uppercase;}
.pill.published{background:#e6f6ea;color:var(--ok);}
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:6px 0 10px;}
.mg-i{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--cream-100);}
.mg-i img{width:100%;height:100%;object-fit:cover;}
.mg-i button{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;cursor:pointer;}
.pill.menunggu{background:#fff3cd;color:#8a5a00;}
.pill.draft{background:#fdf1e8;color:var(--ink-600);}
.item-actions{display:flex;gap:6px;flex:none;}
.empty{text-align:center;padding:40px 20px;color:var(--ink-600);font-size:13px;border:1.5px dashed var(--line);border-radius:var(--radius);}

/* ---------- MODAL FORM ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(43,8,16,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:18px;max-width:520px;width:100%;padding:26px 24px;margin-top:20px;}
.modal h3{font-size:16px;color:var(--maroon-900);margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--cream-100);}
.upload-status{font-size:11.5px;color:var(--ink-600);margin-top:4px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--maroon-950);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:200;display:none;}

/* ---------- PREVIEW & LIVE (editor halaman) ---------- */
.tab-sep{width:1px;background:var(--line);margin:10px 8px;flex:none;}
.tab-btn.special{color:var(--maroon-700);}
.siteview{display:none;padding:16px 16px 40px;max-width:1500px;margin:0 auto;}
.sv-top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px;}
.sv-title{font-size:18px;color:var(--maroon-900);font-family:'Outfit',sans-serif;font-weight:800;}
.sv-title small{display:block;font-size:12px;color:var(--ink-600);font-weight:500;font-family:'Plus Jakarta Sans',sans-serif;}
.sv-pages{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.sv-pill{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--ink-600);cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-family:inherit;}
.sv-pill.active{background:var(--maroon-950);color:#fff;border-color:var(--maroon-950);}
.sv-dot{width:8px;height:8px;border-radius:50%;background:#cfc3bb;}
.sv-dot.draft{background:#e08a1e;} .sv-dot.live{background:var(--ok);}
.sv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px;}
.sv-bar .grow{flex:1;min-width:120px;}
.sv-status{font-size:12px;font-weight:700;color:var(--ink-600);}
.sv-status.dirty{color:#c4620a;}
.sv-devs{display:inline-flex;background:var(--cream-100);border-radius:20px;padding:3px;}
.sv-dev{border:0;background:none;border-radius:16px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--ink-600);cursor:pointer;font-family:inherit;}
.sv-dev.active{background:#fff;color:var(--maroon-800);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.sv-help{font-size:12px;color:var(--ink-600);background:#fff8e6;border:1px solid #f0dca0;border-radius:12px;padding:9px 12px;margin-bottom:12px;line-height:1.6;}
.sv-theme{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:12px;}
.sv-theme>b{font-size:13px;color:var(--maroon-900);}
.sv-sws{display:flex;gap:8px;align-items:center;}
.sv-sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #cdbfc3;cursor:pointer;transition:.2s;padding:0;font:800 16px 'Plus Jakarta Sans',sans-serif;color:#fff;}
.sv-sw:hover{transform:scale(1.14);}
.sv-sw.on{box-shadow:0 0 0 3px var(--maroon-950);transform:scale(1.1);}
.sv-sw.cus{background:conic-gradient(#e0455a,#e9b949,#2f9e7a,#2f6fd0,#8a3fb0,#e0455a);}
.sv-cc{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-600);}
.sv-cc input{width:36px;height:30px;padding:0;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
.sv-tn{font-size:12.5px;font-weight:700;color:var(--ink-900);} .sv-tn small{display:block;font-weight:500;color:var(--ink-600);font-size:11.5px;}
.sv-frame-wrap{background:#d9d3d5;border-radius:16px;padding:12px;display:flex;justify-content:center;overflow:auto;}
.sv-frame{border:0;background:#f1eff0;border-radius:10px;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);width:100%;height:calc(100vh - 300px);min-height:560px;transition:width .2s;}
.btn[disabled]{opacity:.45;pointer-events:none;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-ring">A</div>
    <h1>Panel Admin</h1>
    <p>PPTQ Al Azzaam — Website Informasi</p>
    <div class="field" style="text-align:left"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@email.com"></div>
    <div class="field" style="text-align:left"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
    <button class="btn btn-gold" style="width:100%;justify-content:center" onclick="doLogin()">Masuk</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand"><span class="ring">A</span> Panel Admin</div>
    <button class="btn btn-outline btn-sm" onclick="doLogout()">Keluar</button>
  </div>
  <div class="tabs" id="tabBar"></div>
  <div class="content">
    <div class="content-head">
      <h2 id="contentTitle">—</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" id="bulkBtn" style="display:none;" onclick="openBulkForm()">⚡ Tambah Massal</button>
        <button class="btn btn-gold btn-sm" id="addBtn" onclick="openForm()">+ Tambah</button>
      </div>
    </div>
    <div id="listArea"></div>
  </div>

  <div class="siteview" id="siteViewArea"></div>
</div>

<div class="modal-overlay" id="bulkModalOverlay">
  <div class="modal">
    <h3 id="bulkModalTitle">Tambah Massal</h3>
    <div id="bulkFormArea"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeBulkForm()">Batal</button>
      <button class="btn btn-gold" onclick="submitBulk()">Tambahkan Semua</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">Tambah Data</h3>
    <div id="formArea"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeForm()">Batal</button>
      <button class="btn btn-gold" onclick="saveRecord()">Simpan</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://ttpkztaxfpjhkwtnbpec.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR0cGt6dGF4ZnBqaGt3dG5icGVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MDExOTUsImV4cCI6MjEwMjk3NzE5NX0.yfeSSewI_CDw64WxYU4qUVeEbVLsHXVqpDpeCGDT5PI";
const sb = supabase.createClient(SB_URL, SB_ANON);

// ---------- Konfigurasi tabel (generik, biar 1 mesin CRUD dipakai semua) ----------
const TABLES = {
  berita: {
    label: 'Berita', pk: 'id', orderBy: 'created_at', ascending: false,
    titleField: 'judul',
    meta: r => [r.kategori, `<span class="pill ${r.status}">${r.status}</span>`, r.tanggal_publish ? new Date(r.tanggal_publish).toLocaleDateString('id-ID') : ''],
    fields: [
      {key:'judul', label:'Judul', type:'text', required:true},
      {key:'slug', label:'Slug (URL, huruf kecil tanpa spasi)', type:'text', required:true},
      {key:'ringkasan', label:'Ringkasan Singkat', type:'textarea'},
      {key:'isi', label:'Isi Berita', type:'textarea-lg', required:true, allowInlineImage:true, imageFolder:'berita-inline'},
      {key:'foto_url', label:'Foto Sampul (tampil di kartu & bagian atas artikel)', type:'image', folder:'berita'},
      {key:'kategori', label:'Kategori', type:'select', options:['Prestasi','Kegiatan','Pengumuman']},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
      {key:'tanggal_publish', label:'Tanggal Publish', type:'date'},
    ]
  },
  program: {
    label: 'Program', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'nama',
    meta: r => [r.jenis||'Formal', r.jenjang, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'nama', label:'Nama Program', type:'text', required:true},
      {key:'jenis', label:'Jenis Program', type:'select', options:['Formal','Non-Formal']},
      {key:'jenjang', label:'Kategori/Jenjang (bebas isi apa saja)', type:'text'},
      {key:'deskripsi', label:'Deskripsi', type:'textarea'},
      {key:'icon', label:'Ikon (emoji, misal 📿)', type:'text'},
      {key:'urutan', label:'Urutan Tampil (angka, kecil = di depan)', type:'number'},
      {key:'tombol_label', label:'Teks Tombol Tambahan (kosongkan jika tidak perlu)', type:'text'},
      {key:'tombol_link', label:'Link Tombol Tambahan', type:'text'},
    ]
  },
  galeri: {
    label: 'Galeri', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'judul',
    meta: r => [r.tipe, r.kategori, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'judul', label:'Judul', type:'text'},
      {key:'tipe', label:'Tipe', type:'select', options:['foto','youtube']},
      {key:'media_url', label:'Upload Foto (khusus tipe Foto — kosongkan kalau tipe YouTube)', type:'image', folder:'galeri'},
      {key:'youtube_url', label:'Link YouTube (khusus tipe YouTube — tempel link videonya, thumbnail otomatis)', type:'text'},
      {key:'kategori', label:'Nama Album/Folder (misal: Fasilitas, Wisuda 2027) — item dengan nama folder sama akan dikelompokkan bersama', type:'text'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
    ]
  },
  info_ppdb: {
    label: 'Info PPDB', pk: 'id', orderBy: 'updated_at', ascending: false,
    titleField: 'tahun_ajaran',
    meta: r => [`<span class="pill ${r.status}">${r.status}</span>`],
    fields: [
      {key:'tahun_ajaran', label:'Tahun Ajaran (misal 2027/2028)', type:'text', required:true},
      {key:'syarat', label:'Syarat Pendaftaran', type:'textarea'},
      {key:'jadwal', label:'Jadwal Pendaftaran', type:'textarea'},
      {key:'biaya', label:'Rincian Biaya', type:'textarea'},
      {key:'kontak_wa', label:'Nomor WA Panitia', type:'text'},
      {key:'formulir_url', label:'Link Formulir (Google Form / PDF)', type:'text'},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
    ]
  },
  struktur_pengurus: {
    label: 'Struktur Pengurus', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'nama',
    meta: r => [r.jabatan, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'nama', label:'Nama', type:'text', required:true},
      {key:'jabatan', label:'Jabatan', type:'text'},
      {key:'foto_url', label:'Foto', type:'image', folder:'pengurus'},
      {key:'parent_id', label:'Atasan Langsung (kosongkan jika paling atas)', type:'dynamic-select-pengurus'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
    ]
  },
  flyer_popup: {
    label: 'Flyer Pop-up', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'judul_internal',
    meta: r => [r.ukuran, `<span class="pill ${r.status}">${r.status}</span>`, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'judul_internal', label:'Label Internal (hanya untuk kamu, tidak tampil di website)', type:'text', required:true},
      {key:'gambar_url', label:'Gambar Flyer (disarankan landscape 1200×500)', type:'image', folder:'flyer'},
      {key:'link_url', label:'Link Tujuan (saat gambar diklik)', type:'text'},
      {key:'ukuran', label:'Ukuran Tampil', type:'select', options:['kecil','sedang','besar']},
      {key:'urutan', label:'Urutan Kemunculan (kalau lebih dari 1 aktif)', type:'number'},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
    ]
  },
  instagram_embed: {
    label: 'Instagram', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'keterangan',
    meta: r => [`<span class="pill ${r.status}">${r.status}</span>`, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'keterangan', label:'Keterangan Internal (hanya untuk kamu, misal: "Reels Wisuda Tahfidz")', type:'text'},
      {key:'embed_code', label:'Kode Sematkan Instagram — buka postingan/Reels di Instagram → titik tiga (⋮) → "Sematkan"/"Embed" → copy semua kode, tempel di sini', type:'textarea-lg'},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
      {key:'status', label:'Status', type:'select', options:['draft','published']},
    ]
  },
  testimoni: {
    label: 'Testimoni', pk: 'id', orderBy: 'created_at', ascending: false,
    titleField: 'nama', titleAlt: 'link_url',
    meta: r => [r.bintang ? '★'.repeat(r.bintang) : '', r.isi ? '' : 'link Google Maps', `<span class="pill ${r.status}">${r.status === 'menunggu' ? 'MENUNGGU PERSETUJUAN' : r.status}</span>`, r.media_url ? `<a href="${r.media_url}" target="_blank" rel="noopener">Lihat ${r.media_tipe||'media'}</a>` : '', `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'link_url', label:'⭐ Link Ulasan Google Maps — cukup salin & tempel linknya di sini (boleh hanya ini yang diisi)', type:'text'},
      {key:'nama', label:'Nama Pemberi Ulasan (opsional jika hanya link)', type:'text'},
      {key:'peran', label:'Peran (misal: Wali santri, Alumni)', type:'text'},
      {key:'bintang', label:'Bintang (1–5, boleh kosong jika hanya link)', type:'number'},
      {key:'isi', label:'Isi Ulasan (boleh kosong jika hanya link)', type:'textarea'},
      {key:'waktu', label:'Waktu (misal: 2 bulan lalu — boleh kosong)', type:'text'},
      {key:'foto_url', label:'Foto Profil (opsional)', type:'image', folder:'testimoni'},
      {key:'media_url', label:'Foto/Video kiriman pengunjung (link otomatis — hapus isinya jika tidak ingin ditampilkan)', type:'text'},
      {key:'media_tipe', label:'Jenis media kiriman', type:'select', options:['','foto','video']},
      {key:'urutan', label:'Urutan Tampil', type:'number'},
      {key:'status', label:'Status — ubah ke "published" untuk MENYETUJUI & menampilkan', type:'select', options:['menunggu','draft','published']},
    ]
  },
  kegiatan_santri: {
    label: 'Jadwal Kegiatan', pk: 'id', orderBy: 'urutan', ascending: true,
    titleField: 'judul',
    meta: r => [`${r.jam_mulai||''}${r.jam_selesai?' – '+r.jam_selesai:''}`, r.hari||'', `${(r.foto_urls||[]).length} foto`, `<span class="pill ${r.status}">${r.status}</span>`, `Urutan: ${r.urutan ?? 0}`],
    fields: [
      {key:'judul', label:'Nama Kegiatan', type:'text', required:true},

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = Object.keys(TABLES).map(k =>
    `<button class="tab-btn" id="tab-${k}" onclick="switchTab('${k}')">${TABLES[k].label}</button>`
  ).join('') +
    `<span class="tab-sep"></span>` +
    `<button class="tab-btn special" id="tab-__preview" onclick="switchTab('__preview')">Preview</button>` +
    `<button class="tab-btn special" id="tab-__live" onclick="switchTab('__live')">Live</button>`;
}
function switchTab(key){
  if(key !== '__preview' && key !== '__live' && svDirty() && !confirm('Ada perubahan di Preview yang belum disimpan. Tetap pindah menu?')) return;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  if(key === '__preview' || key === '__live'){
    document.querySelector('.content').style.display = 'none';
    document.getElementById('siteViewArea').style.display = 'block';
    svMode = key === '__preview' ? 'preview' : 'live';
    openSiteView();
    return;
  }
  document.querySelector('.content').style.display = '';
  document.getElementById('siteViewArea').style.display = 'none';
  svFrameUnload();
  currentTab = key;
  document.getElementById('contentTitle').textContent = TABLES[key].label;
  document.getElementById('bulkBtn').style.display = (key === 'galeri' || key === 'instagram_embed') ? 'inline-flex' : 'none';

function renderField(f, value){
  value = value ?? '';
  const id = 'f_' + f.key;
  if(f.type==='textarea' || f.type==='textarea-lg'){
    const rows = f.type==='textarea-lg' ? 7 : 3;
    let extra = '';
    if(f.allowInlineImage){
      extra = `<div style="margin-top:6px;padding:10px;background:var(--cream-100);border-radius:8px;">
        <label style="display:block;margin-bottom:6px;">🖼️ Sisipkan gambar ke dalam teks</label>
        <input type="file" accept="image/*" onchange="insertInlineImage(this,'${id}','${f.imageFolder||'inline'}')">
        <div style="font-size:10.5px;color:var(--ink-600);margin-top:6px;line-height:1.5;">Klik dulu di posisi teks tempat kamu mau taruh gambarnya, baru pilih file. Kodenya <code>[[gambar:...]]</code> otomatis muncul di situ — jangan dihapus/diubah manual, itu yang membuat gambar tampil di tempat itu saat dipublikasikan.</div>
        <div class="upload-status" id="${id}_inlinestatus"></div>
      </div>`;
    }
    return `<div class="field"><label>${f.label}</label><textarea id="${id}" rows="${rows}">${value}</textarea>${extra}</div>`;
  }
  if(f.type==='select'){
    return `<div class="field"><label>${f.label}</label><select id="${id}">
      ${f.options.map(o=>`<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}
    </select></div>`;
  }
  if(f.type==='number'){
    return `<div class="field"><label>${f.label}</label><input type="number" id="${id}" value="${value}"></div>`;
  }
  if(f.type==='date'){
    const d = value ? new Date(value).toISOString().slice(0,10) : '';
    return `<div class="field"><label>${f.label}</label><input type="date" id="${id}" value="${d}"></div>`;
  }
  if(f.type==='dynamic-select-pengurus'){
    return `<div class="field"><label>${f.label}</label>
      <select id="${id}" data-current="${value||''}"><option value="">Memuat…</option></select>
    </div>`;
  }
  if(f.type==='images'){
    const arr = Array.isArray(value) ? value : [];
    return `<div class="field"><label>${f.label}</label>
      <input type="hidden" id="${id}" value='${JSON.stringify(arr).replace(/'/g,'&#39;')}'>
      <div class="multi-grid" id="${id}_grid"></div>
      <input type="file" accept="image/*" multiple onchange="uploadImages(this,'${id}','${f.folder}')">
      <div class="upload-status" id="${id}_status">Foto dikecilkan otomatis. Klik ✕ pada foto untuk menghapusnya dari kegiatan.</div>
    </div>`;
  }
  if(f.type==='image'){
    return `<div class="field"><label>${f.label}</label>
      ${value ? `<img src="${value}" class="img-preview">` : ''}
      <input type="hidden" id="${id}" value="${value}">
      <input type="file" accept="image/*" onchange="uploadImage(this,'${id}','${f.folder}')">
      <div class="upload-status" id="${id}_status"></div>
    </div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" id="${id}" value="${value}"></div>`;
}

let isUploading = false;
function mgRead(id){ try{ return JSON.parse(document.getElementById(id).value||'[]'); }catch(e){ return []; } }
function mgPaint(id){
  const g = document.getElementById(id+'_grid'); if(!g) return;
  g.innerHTML = mgRead(id).map((u,i)=>`<div class="mg-i"><img src="${u}" alt=""><button type="button" onclick="mgDel('${id}',${i})" title="Hapus foto">✕</button></div>`).join('') || '<div style="font-size:12px;color:var(--ink-600)">Belum ada foto.</div>';
}
function mgDel(id,i){ const arr = mgRead(id); arr.splice(i,1); document.getElementById(id).value = JSON.stringify(arr); mgPaint(id); }
async function uploadImages(input, targetId, folder){
  const files = [...input.files]; if(!files.length) return;
  isUploading = true;
  const st = document.getElementById(targetId+'_status'), arr = mgRead(targetId);
  for(let k=0;k<files.length;k++){
    st.textContent = `Mengunggah foto ${k+1} dari ${files.length}…`;
    const c = await compressImage(files[k], 1600, 0.82);
    const path = `${folder}/${Date.now()}-${k}-${files[k].name.replace(/\s+/g,'-')}`;
    const {error} = await sb.storage.from('media-website').upload(path, c);
    if(error){ st.textContent = 'Gagal unggah: ' + error.message; continue; }
    arr.push(sb.storage.from('media-website').getPublicUrl(path).data.publicUrl);
    document.getElementById(targetId).value = JSON.stringify(arr); mgPaint(targetId);
  }
  st.textContent = 'Selesai ✓ — jangan lupa klik Simpan.'; input.value = ''; isUploading = false;
}

// Mengecilkan gambar sebelum upload (dimensi maksimal + kompresi kualitas)
// supaya website tidak lemot karena file foto asli kamera yang besar (bisa 3-5MB).
// PNG tetap PNG (jaga transparansi, misal untuk logo), format lain jadi JPEG.
function compressImage(file, maxDim, quality){
  return new Promise((resolve) => {
    if(!file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 300*1024){
      resolve(file); // sudah kecil atau bukan format yang perlu dikompres, lewati
      return;
    }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      let {width, height} = img;
      if(width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim/width, maxDim/height);
        width = Math.round(width*ratio);
        height = Math.round(height*ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      canvas.toBlob((blob) => {
        URL.revokeObjectURL(objectUrl);
        if(!blob || blob.size >= file.size){ resolve(file); return; }
        const newName = file.name.replace(/\.(png|jpe?g|webp)$/i,'') + (outType==='image/png' ? '.png' : '.jpg');
        resolve(new File([blob], newName, {type: outType}));
      }, outType, quality);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); resolve(file); };
    img.src = objectUrl;
  });
}

async function uploadImage(input, targetId, folder){
  const file = input.files[0];
  if(!file) return;
  isUploading = true;
  const statusEl = document.getElementById(targetId+'_status');
  statusEl.textContent = 'Memproses gambar…';
  const compressed = await compressImage(file, 1600, 0.82);
  statusEl.textContent = 'Mengunggah…';
  const path = `${folder}/${Date.now()}-${file.name.replace(/\s+/g,'-')}`;
  const {error} = await sb.storage.from('media-website').upload(path, compressed);
  if(error){
    statusEl.textContent = 'Gagal unggah: ' + error.message;
    isUploading = false;
    return;
  }
  const {data} = sb.storage.from('media-website').getPublicUrl(path);
  document.getElementById(targetId).value = data.publicUrl;
  statusEl.textContent = 'Berhasil diunggah ✓';
  isUploading = false;
}

async function insertInlineImage(input, textareaId, folder){
  const file = input.files[0];
  if(!file) return;
  const statusEl = document.getElementById(textareaId+'_inlinestatus');
  statusEl.textContent = 'Memproses gambar…';
  const compressed = await compressImage(file, 1600, 0.82);
  statusEl.textContent = 'Mengunggah…';
  const path = `${folder}/${Date.now()}-${file.name.replace(/\s+/g,'-')}`;
  const {error} = await sb.storage.from('media-website').upload(path, compressed);
  if(error){
    statusEl.textContent = 'Gagal unggah: ' + error.message;
    return;
  }
  const {data} = sb.storage.from('media-website').getPublicUrl(path);
  const textarea = document.getElementById(textareaId);
  const token = `\n[[gambar:${data.publicUrl}]]\n`;
  const start = textarea.selectionStart ?? textarea.value.length;
  const end = textarea.selectionEnd ?? textarea.value.length;
  textarea.value = textarea.value.slice(0, start) + token + textarea.value.slice(end);
  textarea.focus();
  textarea.selectionStart = textarea.selectionEnd = start + token.length;
  input.value = '';
  statusEl.textContent = 'Gambar disisipkan ke teks ✓';
}

function updateTickerPreview(){
  const bg = document.getElementById('tickerBg').value;
  const textColor = document.getElementById('tickerTextColor').value;
  const height = document.getElementById('tickerHeight').value;
  const speedPxPerSec = Number(document.getElementById('tickerSpeed').value) || 80;
  const box = document.getElementById('tickerPreviewBox');
  box.style.background = bg;
  box.style.height = height + 'px';
  const textEl = document.getElementById('tickerPreviewText');
  textEl.style.color = textColor;
  textEl.style.lineHeight = height + 'px';
  textEl.style.animation = 'none';
  textEl.textContent = 'Contoh: Pendaftaran Santri Baru Tahun Ajaran 2027/2028 telah dibuka  •  Info lebih lanjut hubungi panitia PPDB';
  // ukur lebar teks asli, baru tentukan durasi -> kecepatan (px/detik) selalu konsisten
  requestAnimationFrame(()=>{
    const distance = textEl.scrollWidth;
    const duration = Math.max(distance / speedPxPerSec, 2);
    textEl.style.animation = `ticker-scroll ${duration}s linear infinite`;
  });
}

async function applyLogoFinal(){

    const path = `logo/${Date.now()}-${pendingLogoFile.name.replace(/\s+/g,'-')}`;
    const {error} = await sb.storage.from('media-website').upload(path, compressed);
    if(error){ statusEl.textContent = 'Gagal unggah: ' + error.message; return; }
    finalUrl = sb.storage.from('media-website').getPublicUrl(path).data.publicUrl;
  } else {

    {key:'logo_type', value: type},

  const {error} = await sb.storage.from('media-website').upload(path, compressed);
  if(error){ statusEl.textContent = 'Gagal unggah: ' + error.message; return; }
  const url = sb.storage.from('media-website').getPublicUrl(path).data.publicUrl;
  const {error: upsertErr} = await sb.from('pengaturan_situs').upsert({key:'favicon_url', value:url});
  if(upsertErr){ statusEl.textContent = 'Gagal simpan: ' + upsertErr.message; return; }
  statusEl.textContent = 'Favicon diterapkan ✓';
  showToast('Favicon diterapkan ✓');
  loadList();
}


async function saveRecord(){
  if(isUploading){
    alert('Tunggu sebentar, gambar masih dalam proses unggah. Coba klik Simpan lagi setelah muncul tulisan "Berhasil diunggah ✓".');
    return;
  }
  const cfg = TABLES[currentTab];
  const payload = {};
  cfg.fields.forEach(f => {
    const el = document.getElementById('f_'+f.key);
    let v = el.value;
    if(f.type==='images'){ try{ v = JSON.parse(v||'[]'); }catch(e){ v = []; } payload[f.key] = v; return; }
    if(f.type==='number') v = v === '' ? null : Number(v);
    payload[f.key] = v === '' ? null : v;
  });

  let error;
  if(currentRecord){
    // update berdasarkan primary key
    const pkVal = currentRecord[cfg.pk];
    ({error} = await sb.from(currentTab).update(payload).eq(cfg.pk, pkVal));
  } else {
    ({error} = await sb.from(currentTab).insert(payload));
  }
  if(error){
    showToast('Gagal menyimpan: ' + error.message);
    return;
  }
  closeForm();
  showToast('Tersimpan ✓');
  loadList();
}

async function deleteRecord(pkVal){
  if(!confirm('Hapus data ini? Tindakan tidak bisa dibatalkan.')) return;
  const cfg = TABLES[currentTab];
  const {error} = await sb.from(currentTab).delete().eq(cfg.pk, pkVal);
  if(error){
    showToast('Gagal menghapus: ' + error.message);
    return;
  }
  showToast('Data dihapus');
  loadList();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 2500);
}

// ================= PREVIEW & LIVE =================
const SITE_PAGES = [
  {k:'index', n:'Beranda'}, {k:'profil', n:'Profil'}, {k:'program', n:'Program'},
  {k:'berita', n:'Berita'}, {k:'galeri', n:'Galeri'}, {k:'ppdb', n:'Pendaftaran'}
];
const SV_WIDTH = {desktop:'100%', tablet:'820px', phone:'390px'};
let svMode = 'preview', svPage = 'index', svDevice = 'desktop', svRows = {}, svTableError = null;

function svApi(){
  const f = document.getElementById('svFrame');
  try{ return f && f.contentWindow && f.contentWindow.PPTQLayout && f.contentWindow.PPTQLayout.isEditor ? f.contentWindow.PPTQLayout : null; }catch(e){ return null; }
}
function svDirty(){
  if(svMode !== 'preview' || document.getElementById('siteViewArea').style.display === 'none') return false;
  const a = svApi(); return !!(a && a.isDirty());
}
function svFrameUnload(){ const f = document.getElementById('svFrame'); if(f) f.src = 'about:blank'; }

async function loadLayoutRows(){
  const {data, error} = await sb.from('layout_halaman').select('halaman,status,data,updated_at');
  svRows = {}; svTableError = error ? error.message : null;
  (data||[]).forEach(r=>{ (svRows[r.halaman] = svRows[r.halaman] || {})[r.status] = r; });
}
function svNorm(r){ return r && r.data ? JSON.stringify(r.data) : '{}'; }
function svIsEmpty(r){ const d = (r && r.data) || {}; return !r || (!Object.keys(d.order||{}).length && !Object.keys(d.size||{}).length && !Object.keys(d.text||{}).length); }
function pageState(k){
  const r = svRows[k] || {};
  if(r.draft && svNorm(r.draft) !== svNorm(r.live) && !(svIsEmpty(r.draft) && svIsEmpty(r.live))) return 'draft';
  if(!svIsEmpty(r.live)) return 'live';
  return 'asli';
}
const SV_STATE_LABEL = {draft:'Draf belum online', live:'Sudah online (diedit)', asli:'Desain awal'};

async function openSiteView(){
  await loadLayoutRows();
  renderSiteView();
}
function renderSiteView(){
  const area = document.getElementById('siteViewArea');
  const isPrev = svMode === 'preview';
  const pills = SITE_PAGES.map(p=>{
    const st = pageState(p.k);
    return `<button class="sv-pill ${p.k===svPage?'active':''}" onclick="svChoosePage('${p.k}')" title="${SV_STATE_LABEL[st]}"><span class="sv-dot ${st}"></span>${p.n}</button>`;
  }).join('');
  const devs = [['desktop','Desktop'],['tablet','Tablet'],['phone','HP']].map(([k,n])=>
    `<button class="sv-dev ${k===svDevice?'active':''}" onclick="svSetDevice('${k}')">${n}</button>`).join('');
  const missing = svTableError ? `<div class="sv-help" style="background:#fdecec;border-color:#f3bcbc;">Tabel <b>layout_halaman</b> belum ada. Jalankan file <b>013_layout_halaman.sql</b> di Supabase SQL Editor dulu supaya simpan draf dan publikasi bisa dipakai. (${svTableError})</div>` : '';
  area.innerHTML = `
    <div class="sv-top">
      <div class="sv-title">${isPrev ? 'Preview — halaman yang belum online' : 'Live — halaman yang sedang online'}
        <small>${isPrev ? 'Atur susunan dan tulisan di sini. Pengunjung baru melihatnya setelah kamu klik Publikasikan.' : 'Ini persis tampilan yang dilihat pengunjung website sekarang.'}</small></div>
      <div class="sv-devs">${devs}</div>
    </div>
    ${missing}
    <div class="sv-pages">${pills}</div>
    ${isPrev ? `
    <div class="sv-bar">
      <button class="btn btn-outline btn-sm" id="svUndo" onclick="svUndo()" disabled>Urungkan</button>
      <button class="btn btn-outline btn-sm" id="svRedo" onclick="svRedo()" disabled>Ulangi</button>
      <span class="sv-status grow" id="svStatus">Memuat…</span>
      <button class="btn btn-outline btn-sm" onclick="svResetDesign()">Kembalikan desain awal</button>
      <button class="btn btn-outline btn-sm" onclick="svDiscard()">Buang draf</button>
      <button class="btn btn-outline btn-sm" id="svSaveBtn" onclick="svSave(false)">Simpan draf</button>
      <button class="btn btn-gold btn-sm" id="svPubBtn" onclick="svSave(true)">Publikasikan</button>
    </div>
    <div class="sv-theme" id="svTheme">
      <b>🎨 Warna situs</b>
      <div class="sv-sws" id="svSw"></div>
      <div class="sv-tn" id="svTn">Memuat…</div>
      <span class="sv-cc">Utama <input type="color" id="thP" oninput="svThemeLive()" onchange="svThemeCommit()"></span>
      <span class="sv-cc">Aksen <input type="color" id="thA" oninput="svThemeLive()" onchange="svThemeCommit()"></span>
      <span class="sv-cc">Latar <input type="color" id="thB" oninput="svThemeLive()" onchange="svThemeCommit()"></span>
      <button class="btn btn-outline btn-sm" onclick="svThemePick('maroon')">Warna asli pondok</button>
    </div>
    <div class="sv-help"><b>Cara pakai:</b> klik sebuah blok untuk memilihnya. <b>Seret ikon panah</b> di sudut kiri atas untuk memindahkan. <b>Tarik tepi kanan, bawah, atau sudut</b> untuk membesarkan atau mengecilkan (tampilan Desktop). <b>Klik 2x pada tulisan</b> untuk mengeditnya, lalu klik di luar untuk selesai. Editan ini hanya mengubah tampilan, <b>tidak mengubah data berita, program, galeri, dan lainnya</b>. Tulisan yang berasal dari data (isi berita, nama program, dsb) tetap diubah lewat menu biasa.</div>
    ` : `
    <div class="sv-bar">
      <span class="sv-status grow">Halaman: ${SITE_PAGES.find(p=>p.k===svPage).n} · ${SV_STATE_LABEL[pageState(svPage)] === 'Desain awal' ? 'memakai desain awal' : 'memakai tata letak hasil publikasi'}</span>
      <a class="btn btn-outline btn-sm" href="${svPage}.html" target="_blank" rel="noopener">Buka di tab baru</a>
      <button class="btn btn-outline btn-sm" onclick="svReloadFrame()">Muat ulang</button>
      <button class="btn btn-danger btn-sm" onclick="svUnpublish()">Cabut tata letak live</button>
    </div>`}
    <div class="sv-frame-wrap"><iframe id="svFrame" class="sv-frame" title="Tampilan halaman" style="width:${SV_WIDTH[svDevice]}"></iframe></div>`;
  svReloadFrame();
}
function svReloadFrame(){
  const f = document.getElementById('svFrame'); if(!f) return;
  const q = (svMode === 'preview' ? '?editor=1&' : '?') + '_=' + Date.now();
  f.onload = svFrameLoaded;
  f.src = svPage + '.html' + q;
}
async function svFrameLoaded(){
  if(svMode !== 'preview') return;
  const a = svApi(); if(!a) { const st = document.getElementById('svStatus'); if(st) st.textContent = 'Editor tidak aktif (pastikan masih login).'; return; }
  await a.ready;
  a.onChange(svUpdateBar);
  svUpdateBar();
  svThemeRender();
}
function svUpdateBar(){
  const a = svApi(); if(!a) return;
  const st = document.getElementById('svStatus');
  const dirty = a.isDirty();
  if(st){
    st.textContent = dirty ? 'Ada perubahan yang belum disimpan' : (SV_STATE_LABEL[pageState(svPage)] || '');
    st.classList.toggle('dirty', dirty);
  }
  const u = document.getElementById('svUndo'), r = document.getElementById('svRedo');
  if(u) u.disabled = !a.canUndo(); if(r) r.disabled = !a.canRedo();
  svThemeRender();
}
// ---- Warna situs (berlaku untuk semua halaman; disimpan bersama draf / publikasi) ----
let svThemePrev = null;
function svTema(){ const f = document.getElementById('svFrame'); try{ return f.contentWindow.PPTQTema || null; }catch(e){ return null; } }
function svThemeRender(){
  const T = svTema(), a = svApi(), box = document.getElementById('svTheme'); if(!T || !a || !box) return;
  const cur = a.getTheme() || {pal:'maroon'};
  const c = T.resolve(cur) || T.PALS.maroon;
  document.getElementById('svSw').innerHTML = Object.keys(T.PALS).map(k=>
    `<button type="button" class="sv-sw ${cur.pal===k?'on':''}" title="${T.PALS[k].n} — ${T.PALS[k].d}" style="background:linear-gradient(135deg,${T.PALS[k].p} 50%,${T.PALS[k].a} 50%)" onclick="svThemePick('${k}')"></button>`).join('')
    + `<button type="button" class="sv-sw cus ${cur.pal==='custom'?'on':''}" title="Warna kustom: pilih sendiri di kotak sebelah" onclick="svThemeCustom()">+</button>`;
  document.getElementById('svTn').innerHTML = cur.pal === 'custom' ? 'Kustom<small>Warna pilihan sendiri</small>' : `${T.PALS[cur.pal].n}<small>${T.PALS[cur.pal].d}</small>`;
  document.getElementById('thP').value = c.p; document.getElementById('thA').value = c.a; document.getElementById('thB').value = c.bg;
}
function svThemePick(k){ const a = svApi(); if(!a) return; a.setTheme({pal:k}); }
function svThemeCustom(){ const a = svApi(); if(!a) return; const T = svTema(), cur = T.resolve(a.getTheme() || {pal:'maroon'}) || T.PALS.maroon; a.setTheme({pal:'custom', p:cur.p, a:cur.a, bg:cur.bg}); }
function svThemeLive(){
  const a = svApi(); if(!a) return;
  if(!svThemePrev) svThemePrev = a.getState();
  a.previewTheme({pal:'custom', p:document.getElementById('thP').value, a:document.getElementById('thA').value, bg:document.getElementById('thB').value});
}
function svThemeCommit(){
  const a = svApi(); if(!a || !svThemePrev) return;
  const t = {pal:'custom', p:document.getElementById('thP').value, a:document.getElementById('thA').value, bg:document.getElementById('thB').value};
  const prev = svThemePrev; svThemePrev = null;
  a.finishPreview(prev, Object.assign({}, prev, {theme:t}));
}
function svChoosePage(k){
  if(k === svPage) return;
  if(svDirty() && !confirm('Ada perubahan yang belum disimpan di halaman ini. Tetap pindah halaman?')) return;
  svPage = k; renderSiteView();
}
function svSetDevice(d){
  svDevice = d;
  document.querySelectorAll('.sv-dev').forEach(b=>b.classList.toggle('active', b.textContent === {desktop:'Desktop',tablet:'Tablet',phone:'HP'}[d]));
  const f = document.getElementById('svFrame'); if(f) f.style.width = SV_WIDTH[d];
  setTimeout(()=>{ const a = svApi(); if(a && window.frames[0] && 0){} }, 100);
}
function svUndo(){ const a = svApi(); if(a) a.undo(); }
function svRedo(){ const a = svApi(); if(a) a.redo(); }
function svResetDesign(){
  const a = svApi(); if(!a) return;
  if(!confirm('Kembalikan halaman ini ke desain awal (semua susunan, ukuran, dan tulisan hasil edit dihapus dari draf)? Kamu masih bisa menekan Urungkan.')) return;
  a.clearAll();
}
async function svSave(publish){
  const a = svApi(); if(!a) return;
  if(publish && !confirm('Publikasikan ke website? Pengunjung akan langsung melihat tampilan ini.')) return;
  const st = a.getState(), theme = st.theme; delete st.theme;
  const data = Object.assign({v:2}, st), now = new Date().toISOString();
  const rows = [{halaman:svPage, status:'draft', data, updated_at:now}];
  if(publish) rows.push({halaman:svPage, status:'live', data, updated_at:now});
  // warna situs: baris terpisah '_tema' (berlaku untuk semua halaman)
  if(theme){
    const td = Object.assign({v:2}, theme);
    rows.push({halaman:'_tema', status:'draft', data:td, updated_at:now});
    if(publish) rows.push({halaman:'_tema', status:'live', data:td, updated_at:now});
  }
  const {error} = await sb.from('layout_halaman').upsert(rows);
  if(error){ showToast('Gagal menyimpan: ' + error.message); return; }
  a.markSaved();
  await loadLayoutRows();
  document.querySelectorAll('.sv-pill').forEach((el,i)=>{
    const k = SITE_PAGES[i].k, s2 = pageState(k);
    el.querySelector('.sv-dot').className = 'sv-dot ' + s2; el.title = SV_STATE_LABEL[s2];
  });
  svUpdateBar();
  showToast(publish ? 'Dipublikasikan. Website sudah memakai tampilan ini.' : 'Draf tersimpan (belum online).');
}
async function svDiscard(){
  if(!confirm('Buang draf halaman ini? Preview kembali ke tampilan yang sedang online.')) return;
  const {error} = await sb.from('layout_halaman').delete().eq('halaman', svPage).eq('status','draft');
  if(error){ showToast('Gagal: ' + error.message); return; }
  await loadLayoutRows(); renderSiteView(); showToast('Draf dibuang.');
}
async function svUnpublish(){
  if(!confirm('Cabut tata letak live? Halaman ini di website kembali memakai desain awal. Drafmu tidak ikut terhapus.')) return;
  const {error} = await sb.from('layout_halaman').delete().eq('halaman', svPage).eq('status','live');
  if(error){ showToast('Gagal: ' + error.message); return; }
  try{ localStorage.removeItem('lay_' + svPage); }catch(e){}
  await loadLayoutRows(); renderSiteView(); showToast('Tata letak live dicabut.');
}
window.addEventListener('beforeunload', e=>{ if(svDirty()){ e.preventDefault(); e.returnValue = ''; } });

checkSession();

</script>
